<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a free ResuAI account to generate AI-powered resumes and cover letters.">
    <title>ResuAI — Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page-wrapper">

    <!-- Registration Card -->
    <div class="auth-card">
        <div class="auth-card-header">
            <a href="index.html" class="auth-logo">
                <div class="logo-icon">R</div>
                <span class="logo-title">ResuAI</span>
            </a>
            <h1>Create your account</h1>
            <p>Join ResuAI and start generating professional documents instantly.</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
            <div class="form-group">
                <label for="regName">Full Name</label>
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" id="regName" required placeholder="e.g. Alex Johnson" autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address</label>
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="email" id="regEmail" required placeholder="you@example.com" autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="regPassword">Password</label>
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="regPassword" required placeholder="Minimum 6 characters" autocomplete="new-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('regPassword', this)" aria-label="Toggle password">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="regConfirm">Confirm Password</label>
                <div class="input-group">
                    <span class="input-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </span>
                    <input type="password" id="regConfirm" required placeholder="Re-enter your password" autocomplete="new-password">
                </div>
            </div>

            <!-- Error / Success message area -->
            <div id="regMessage" style="display:none; font-size: 13px; margin-bottom: 14px; padding: 10px 14px; border-radius: var(--radius-sm);"></div>

            <button type="submit" class="btn-primary" id="btnRegister">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
                Create Account
            </button>

            <!-- Social Auth Divider -->
            <div class="auth-divider">OR</div>

            <!-- Social Login Buttons -->
            <div class="social-auth-container">
                <!-- Official Google Sign-In button will render here -->
                <div id="googleSignInContainer" class="google-btn-container" style="width: 100%; min-height: 40px; display: flex; justify-content: center;"></div>
                <button type="button" class="social-btn facebook-btn" onclick="handleFacebookLogin()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path fill="#ffffff" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    Continue with Facebook
                </button>
            </div>
        </form>

        <div class="auth-footer-text">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <p style="font-size: 11px; color: var(--text-muted);">
        &copy; 2026 ResuAI 
    </p>

    <div class="toast-container" id="toastContainer"></div>

    <script src="auth.js"></script>
    <script>
        // Apply saved theme preference
        (function() {
            if (localStorage.getItem("resuai_theme_preference") === "light") {
                document.body.classList.add("light-theme");
            }
        })();

        // If already logged in, skip registration
        if (getCurrentUser()) {
            window.location.href = "dashboard.html";
        }

        function handleRegister() {
            const name     = document.getElementById("regName").value.trim();
            const email    = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const confirm  = document.getElementById("regConfirm").value;
            const msgEl    = document.getElementById("regMessage");
            const btn      = document.getElementById("btnRegister");

            msgEl.style.display = "none";

            // Client-side password match check
            if (password !== confirm) {
                showMessage("Passwords do not match. Please try again.", "error");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creating account...";

            setTimeout(() => {
                const result = registerUser(name, email, password);
                if (result.success) {
                    // Auto-login upon successful registration
                    loginUser(email, password);
                    showMessage(result.message + " Redirecting to dashboard...", "success");
                    setTimeout(() => window.location.href = "dashboard.html", 1800);
                } else {
                    showMessage(result.message, "error");
                    btn.disabled = false;
                    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg> Create Account`;
                }
            }, 300);
        }

        function showMessage(msg, type) {
            const el = document.getElementById("regMessage");
            el.textContent = msg;
            el.style.display = "block";
            if (type === "error") {
                el.style.color = "var(--text-danger)";
                el.style.background = "rgba(239,68,68,0.08)";
                el.style.border = "1px solid rgba(239,68,68,0.2)";
            } else {
                el.style.color = "var(--text-success)";
                el.style.background = "rgba(16,185,129,0.08)";
                el.style.border = "1px solid rgba(16,185,129,0.2)";
            }
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const isText = input.type === "text";
            input.type = isText ? "password" : "text";
            btn.innerHTML = isText
                ? `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`
                : `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
        }
    </script>
</body>
</html>
